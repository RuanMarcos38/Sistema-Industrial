name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: industrial_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d industrial_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/industrial_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/industrial_ci?schema=public
      AUTH_SECRET: ci-only-secret-change-me-32-characters
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Supabase migration SQL
        run: |
          createdb -h localhost -U postgres industrial_migration_ci
          psql -h localhost -U postgres -d industrial_migration_ci -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create schema auth;
          create table auth.users(id uuid primary key);
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          SQL
          psql -h localhost -U postgres -d industrial_migration_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20260901010000_enterprise_foundation.sql

      - run: npm install
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
